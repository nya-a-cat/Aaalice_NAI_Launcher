name: Local Gallery Vibe Targeted Validation

on:
  push:
    branches:
      - ci/local-gallery-vibe-build
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.2"
  PUB_HOSTED_URL: "https://pub.flutter-io.cn"

jobs:
  targeted:
    name: Analyze and run local gallery Vibe tests
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Prepare incremental Flutter build
        uses: ./.github/actions/prepare-flutter-build
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache-namespace: nai-hosted

      - name: Format changed Dart sources
        shell: pwsh
        run: |
          $files = @(
            'lib/core/database/datasources/gallery_vibe_family_repository.dart',
            'lib/data/models/vibe/vibe_family.dart',
            'lib/data/services/vibe_style',
            'lib/presentation/providers/vibe_family_provider.dart',
            'lib/presentation/screens/vibe_library/widgets/vibe_families',
            'lib/presentation/screens/vibe_library/widgets/local_gallery_vibe_content_view.dart',
            'lib/presentation/screens/vibe_library/widgets/vibe_library_source_workspace.dart',
            'test/data/services/vibe_style_test.dart',
            'test/core/database/datasources/gallery_vibe_family_repository_test.dart'
          )
          dart format @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $patch = (git diff --binary --no-ext-diff) -join "`n"
          [IO.File]::WriteAllText('vibe-generated.patch', $patch + "`n", [Text.UTF8Encoding]::new($false))

      - name: Upload generated source patch
        uses: actions/upload-artifact@v6
        with:
          name: vibe-generated-sources
          path: vibe-generated.patch
          retention-days: 1

      - name: Analyze
        run: flutter analyze

      - name: Check Vibe grouping and source safety
        shell: pwsh
        run: |
          ./scripts/test_affected.ps1 -TimeoutSeconds 120 -Path @(
            'test/data/services/vibe_style_test.dart',
            'test/core/database/datasources/gallery_vibe_family_repository_test.dart',
            'test/presentation/screens/vibe_library/local_gallery_vibe_view_test.dart'
          )
